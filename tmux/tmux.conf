# ==========================================
# ОСНОВНЫЕ НАСТРОЙКИ И ЦВЕТА
# ==========================================
# Поддержка 256 цветов (True Color)
set -g default-terminal "screen-256color"

# Основной префикс (Ctrl + a вместо Ctrl + b)
set -g prefix C-a
unbind C-b
# Позволяет отправлять Ctrl+a в другие программы (например, bash) по двойному нажатию
bind C-a send-prefix

# Сортировка сессий по имени
bind s choose-tree -sZ -O name

# Изменение индексов (отсчет окон и панелей с 1 вместо 0)
set -g base-index 1
setw -g pane-base-index 1

# Включение мыши (скролл, выбор панелей, изменение размера)
set -g mouse on

# ==========================================
# ГОРЯЧИЕ КЛАВИШИ И ПАНЕЛИ
# ==========================================
# Перезагрузка конфигурации tmux кнопкой 'r'
unbind r
bind r source-file ~/.tmux.conf \; display-message "Конфигурация перезагружена!"

# Разделение панелей с сохранением текущего пути (директории)
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Создание нового окна с сохранением текущего пути
bind c new-window -c "#{pane_current_path}"

# Изменение размера панелей клавишами hjkl (зажать Ctrl+a и нажимать стрелки/hjkl)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Развернуть панель на весь экран и вернуть обратно (Максимизация)
bind -r m resize-pane -Z

# ==========================================
# РЕЖИМ КОПИРОВАНИЯ (VI MODE)
# ==========================================
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection 
bind-key -T copy-mode-vi 'y' send -X copy-selection 

# Отключение сброса выделения мыши при отпускании левой кнопки
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==========================================
# ПЛАГИНЫ И АВТОСОХРАНЕНИЕ
# ==========================================
# Менеджер плагинов TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-sessionist'

# Плагины для сохранения и восстановления сессий
set -g @plugin 'tmux-plugins/tmux-resurrect' 
set -g @plugin 'tmux-plugins/tmux-continuum'

# Настройка темы
set -g @themepack 'powerline/default/cyan'
# Сохранять содержимое и историю внутри панелей
set -g @resurrect-capture-pane-contents 'on'

# НАСТРОЙКА ЛОГИКИ СОХРАНЕНИЯ (По вашему запросу):
# 1. Выключаем фоновое сохранение каждые 15 минут, чтобы удаленные сессии не бэкапились
set -g @continuum-save-interval '0'

# 2. Включаем автоматическое восстановление при старте tmux
set -g @continuum-restore 'on'

# 3. Удерживаем сервер tmux активным для корректной записи состояния при выключении
set -g destroy-unattached off

# Старт менеджера плагинов TPM (эта строка всегда должна быть в самом конце)
run '~/.tmux/plugins/tpm/tpm'

